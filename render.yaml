# Render Blueprint: creates the web app + PostgreSQL database in one click.
# Render dashboard > New > Blueprint > pick this GitHub repo.
services:
  - type: web
    name: botoko
    runtime: python
    plan: free            # change to "starter" ($7/mo) for the defense: no sleeping, 5x more CPU
    region: singapore     # closest region to the Philippines
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: botoko-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true   # made ONCE by Render and kept: restarts/deploys don't log anyone out
      - key: ADMIN_PASSWORD
        sync: false       # Render will ask you to type this in
      # Online registration: rate limit per student's IP address (Render passes it in X-Forwarded-For).
      - key: TRUST_PROXY
        value: "1"
      - key: REGISTER_LIMIT
        value: "10"       # registrations per IP per 10 minutes; raise it if a class registers from one Wi-Fi
      # Worker processes are auto-detected (1 per physical CPU core, see concurrency.py).
      # MAX_WORKERS caps that number: the free plan has 512 MB RAM and Render can report the
      # host's cores (e.g. 16). Set WEB_CONCURRENCY only if you want a fixed number instead.
      - key: MAX_WORKERS
        value: "4"
      - key: THREADS
        value: "8"
      - key: DB_POOL_SIZE
        value: "8"

databases:
  - name: botoko-db
    plan: free
    region: singapore
